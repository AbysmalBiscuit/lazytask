# LazyTask Default Configuration
# This file contains the default configuration values for LazyTask.
# A config file may set any subset of these keys; absent keys keep their defaults.

[theme]
name = "catppuccin-mocha"

[theme.colors]
background = "#1e1e2e"
foreground = "#cdd6f4"  
primary = "#89b4fa"
secondary = "#f38ba8"
success = "#a6e3a1"
warning = "#f9e2af"
error = "#f38ba8"

[ui]
default_view = "task_list"
show_help_bar = true
task_list_columns = [
    "id",
    "project", 
    "priority",
    "due",
    "description"
]

[sync]
auto_sync_interval = 5

[taskwarrior]
# Leave empty to auto-detect from environment
taskrc_path = ""
data_location = ""

# Key syntax and every action: docs/keybindings.md
[keybindings.global]
quit = "q"
force_quit = "Ctrl+c"
help = "F1"
refresh = "F5"
back = "Esc"
reports = "r"
sync = "s"
sync_config = "S"
# force_sync has no default key
# force_sync = "Ctrl+s"

[keybindings.task_list]
move_up = "Up"
move_down = "Down"
add_task = "a"
edit_task = "e"
done_task = "d"
delete_task = "Delete"
filter = "/"

[keybindings.reports]
toggle_calendar = "c"
prev_day = "Left"
next_day = "Right"
prev_week = "Up"
next_week = "Down"
prev_month = "<"
next_month = ">"
today = "t"

[keybindings.form]
next_field = "Tab"
prev_field = "Shift+Tab"
move_up = "Up"
move_down = "Down"
move_left = "Left"
move_right = "Right"
toggle = "Space"
erase = "Backspace"
confirm = "Enter"
cancel = "Esc"
