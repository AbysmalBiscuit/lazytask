name: Build
on:
  # Build on PRs to verify cross-platform compilation.
  pull_request:
  # Build + create a GitHub Release when a `v*` tag is pushed.
  push:
    tags:
      - "v*"
  # Allow manual re-runs (e.g. to re-attach assets if a release was edited).
  workflow_dispatch:
  # Allow other workflows (e.g. a future release.yml) to call this one.
  workflow_call:
permissions:
  # Needed for softprops/action-gh-release to create the Release on tag push.
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            rust_flags: ""
            features: ""
          # Apple Silicon (M1/M2/M3): macos-14+ runners are arm64.
          - os: macos-14
            target: aarch64-apple-darwin
            rust_flags: ""
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_flags: ""
            features: ""
            binary_postfix: ""
            upx_args: --best --lzma
            strip: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rust_flags: ""
            features: ""
            binary: "lazytask-x86_64-unknown-linux-musl"
            upx_args: --best --lzma
            strip: true
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            rust_flags: -C target-feature=+crt-static
            features: ""
            binary_postfix: ".exe"
            upx_args: -9
            strip: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_flags: -C target-feature=+crt-static
            features: ""
            binary_postfix: ".exe"
            upx_args: -9
            strip: false
          - os: windows-latest
            target: i686-pc-windows-msvc
            rust_flags: -C target-feature=+crt-static
            features: ""
            binary_postfix: ".exe"
            upx_args: -9
            strip: false
    env:
      RUSTFLAGS: ${{ matrix.rust_flags }}
      # macOS 11 (Big Sur, Nov 2020) is the oldest version Apple still
      # provides security updates for; bumped from 10.7 (2011) which is
      # well below modern rustc requirements.
      MACOSX_DEPLOYMENT_TARGET: 11.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - uses: clechasseur/rs-cargo@v4
        with:
          command: build
          args: --release ${{matrix.features}} --target=${{ matrix.target }}
      - name: Compress binaries
        uses: svenstaro/upx-action@v2
        with:
          files: target/${{ matrix.target }}/release/lazytask${{ matrix.binary_postfix }}
          args: ${{ matrix.upx_args }}
          strip: ${{ matrix.strip }}
        # MacOS UPX is unsupported (codesigning + Mach-O quirks):
        # https://github.com/upx/upx/blob/44e4bd0b5454ff8aee1ff3376974dfe6014300d9/NEWS#L31
        if: ${{ !startsWith(matrix.os, 'macos') }}
      - name: Packaging binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf lazytask-${{ matrix.target }}.tar.gz lazytask${{ matrix.binary_postfix }}
          if [[ ${{ runner.os }} == 'Windows' ]]; then
            certutil -hashfile lazytask-${{ matrix.target }}.tar.gz sha256 | grep -E [A-Fa-f0-9]{64} > lazytask-${{ matrix.target }}.sha256
          else
            shasum -a 256 lazytask-${{ matrix.target }}.tar.gz > lazytask-${{ matrix.target }}.sha256
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazytask-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/lazytask-${{ matrix.target }}.tar.gz
      - name: Releasing assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/lazytask-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/lazytask-${{ matrix.target }}.sha256
          # Auto-fill the release body from commit messages between this tag
          # and the previous one. You can edit the release after publish to
          # tweak the wording without re-uploading assets.
          generate_release_notes: true
          # Mark pre-1.0 / pre-release tags (e.g. v0.2.0-alpha.1) as prerelease.
          prerelease: ${{ contains(github.ref, '-') }}
          # Stay as draft for v0.x — flip to false once you reach a stable v1.0.0.
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
