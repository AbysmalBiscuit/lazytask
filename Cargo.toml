[package]
name = "lazytask"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "lazytask"
authors = ["LazyTask Contributors"]
description = "Modern Terminal UI for TaskChampion (Taskwarrior-compatible task storage)"
license = "MIT"
repository = "https://github.com/osamamahmood/lazytask"

[[bin]]
name = "lazytask"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dirs = "6.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde_json = "1.0"
taskchampion = { version = "3", default-features = false, features = ["server-sync", "server-local", "storage", "bundled", "tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[[test]]
name = "taskwarrior_compat"
path = "tests/integration/taskwarrior_compat.rs"

[[test]]
name = "models"
path = "tests/unit/models.rs"

[[test]]
name = "filters"
path = "tests/unit/filters.rs"

[[test]]
name = "config"
path = "tests/unit/config.rs"
