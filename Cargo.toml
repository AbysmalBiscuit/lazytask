[package]
name = "lazytask"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
resolver = "3"
default-run = "lazytask"
authors = ["LazyTask Contributors"]
description = "Modern Terminal UI for TaskChampion (Taskwarrior-compatible task storage)"
license = "MIT"
repository = "https://github.com/AbysmalBiscuit/lazytask"

[[bin]]
name = "lazytask"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1"
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dirs = "6.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde_json = "1.0"
taskchampion = { version = "3", default-features = false, features = ["server-sync", "server-local", "server-gcp", "server-aws", "storage", "bundled", "tls-webpki-roots"] }
strum = { version = "0.28", features = ["derive"] }
enum_dispatch = "0.3"
notify = "8.2"
schemars = "1"
# TLS comes from taskchampion's `tls-webpki-roots` feature, which enables it
# on this same reqwest.
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[[test]]
name = "models"
path = "tests/unit/models.rs"

[[test]]
name = "filters"
path = "tests/unit/filters.rs"

[[test]]
name = "config"
path = "tests/unit/config.rs"

[[test]]
name = "integration_engine"
path = "tests/integration_engine.rs"

[[test]]
name = "integration_sync"
path = "tests/integration_sync.rs"

[[test]]
name = "integration_ui"
path = "tests/integration_ui.rs"

[[test]]
name = "integration_remote_sync"
path = "tests/integration_remote_sync.rs"

[[test]]
name = "integration_tui_input"
path = "tests/integration_tui_input.rs"

[[test]]
name = "integration_taskrc"
path = "tests/integration_taskrc.rs"

[[test]]
name = "integration_app"
path = "tests/integration_app.rs"

[[test]]
name = "config_schema"
path = "tests/config_schema.rs"

[[test]]
name = "doctor"
path = "tests/doctor.rs"

[profile.dist]
inherits = "release"
lto = "thin"
